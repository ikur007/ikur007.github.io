<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ikur007</title>
    <style>
      :root {
        --bg: #0d1117;
        --bg-panel: #11161d;
        --line: #22303f;
        --text: #d7e1ea;
        --muted: #5c6b7a;
        --accent: #ffb454;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        overflow: hidden;
      }
      .scanline {
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.025) 0px,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px,
          transparent 3px
        );
        pointer-events: none;
        z-index: 5;
      }
      .stage {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .frame {
        border: 1px solid var(--line);
        background: var(--bg-panel);
        padding: 48px 64px;
        border-radius: 4px;
        box-shadow:
          0 0 0 1px rgba(255, 180, 84, 0.04),
          0 20px 60px rgba(0, 0, 0, 0.5);
        position: relative;
        max-width: 90vw;
        max-height: 90vh;
        overflow-y: auto;
      }
      .frame::before {
        content: "user@ikur007:~$";
        position: absolute;
        top: -12px;
        left: 20px;
        background: var(--bg);
        padding: 0 8px;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.04em;
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.2em;
        color: var(--muted);
        margin: 0 0 14px 0;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(40px, 9vw, 96px);
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text);
        white-space: nowrap;
      }
      h1 .zeros {
        color: var(--accent);
      }
      .cursor {
        display: inline-block;
        width: 0.5ch;
        background: var(--accent);
        margin-left: 6px;
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }
      .sub {
        margin-top: 18px;
        font-size: 13px;
        color: var(--muted);
        letter-spacing: 0.02em;
      }
      .sub span {
        color: var(--accent);
      }
      .poc-log {
        margin-top: 22px;
        padding-top: 16px;
        border-top: 1px dashed var(--line);
        font-size: 11px;
        line-height: 1.8;
        color: var(--muted);
      }
      .poc-log .k {
        color: var(--muted);
      }
      .poc-log .v {
        color: var(--accent);
        word-break: break-all;
      }

      .history-section {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px dashed var(--line);
      }

      @media (max-width: 520px) {
        .frame {
          padding: 32px 24px;
        }
        .frame::before {
          font-size: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="scanline"></div>
    <div class="stage">
      <div class="frame">
        <p class="eyebrow">welcome to</p>
        <h1>
          ikur<span class="zeros">007</span><span class="cursor">&nbsp;</span>
        </h1>
        <p class="sub">status: <span>online</span></p>

        <div class="poc-log">
          <div>
            <span class="k">ip_address:</span>
            <span class="v" id="ip">Fetching...</span>
          </div>
          <div>
            <span class="k">date:</span>
            <span class="v" id="date">Loading...</span>
          </div>
          <div>
            <span class="k">time:</span>
            <span class="v" id="clock">Loading...</span>
          </div>
          <div>
            <span class="k">browser:</span>
            <span class="v" id="browser">Loading...</span>
          </div>
          <br />
          <div>
            <span class="k">referrer:</span> <span class="v" id="ref"></span>
          </div>
          <div>
            <span class="k">landed_at:</span>
            <span class="v" id="landed_time"></span>
          </div>
          <div>
            <span class="k">url:</span> <span class="v" id="url"></span>
          </div>
          <div>
            <span class="k">user_agent:</span>
            <span class="v" id="ua">Loading...</span>
          </div>

          <!-- Bagian History 10 Pengunjung -->
          <div class="history-section">
            <div class="k" style="margin-bottom: 8px">
              --- 10 RECENT LOGINS (LOCAL) ---
            </div>
            <div id="history-list">Memuat riwayat...</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // --- Referrer, Time, URL ---
      document.getElementById("ref").textContent =
        document.referrer || "(empty — no referrer sent)";
      document.getElementById("landed_time").textContent =
        new Date().toISOString();
      document.getElementById("url").textContent = window.location.href;

      // --- Fungsi Simpan 10 Riwayat ---
      function handleVisitorHistory(ipToSave) {
        const nowInfo = new Date();
        const currentVisit = {
          ip: ipToSave,
          time: nowInfo.toLocaleTimeString("id-ID", {
            timeZone: "Asia/Jakarta",
          }),
          date: nowInfo.toLocaleDateString("id-ID", {
            timeZone: "Asia/Jakarta",
          }),
        };

        // Ambil data lama, tambah yang baru di depan, potong jadi 10 max
        let history = JSON.parse(
          localStorage.getItem("visitor_history") || "[]",
        );
        history.unshift(currentVisit);
        history = history.slice(0, 10);
        localStorage.setItem("visitor_history", JSON.stringify(history));

        // Tampilkan ke layar
        const container = document.getElementById("history-list");
        container.innerHTML = history
          .map(
            (item, i) =>
              `<div><span class="k">[${i + 1}]</span> <span class="v">${item.ip} (${item.date} ${item.time})</span></div>`,
          )
          .join("");
      }

      // --- IP Fetch dengan Fallback LENGKAP ---
      async function getIP() {
        const ipElement = document.getElementById("ip");
        let finalIP = "Unknown";

        try {
          // Coba 1: Cloudflare Trace
          let res1 = await fetch("https://1.1.1.1/cdn-cgi/trace");
          let data1 = await res1.text();
          let lines = data1.split("\n");
          let ipLine = lines.find((line) => line.startsWith("ip="));
          if (ipLine) {
            finalIP = ipLine.split("=")[1];
          } else {
            throw new Error("Cloudflare gagal");
          }
        } catch (e1) {
          try {
            // Coba 2: API ipify
            let res2 = await fetch("https://api.ipify.org?format=json");
            let data2 = await res2.json();
            finalIP = data2.ip;
          } catch (e2) {
            try {
              // Coba 3: API db-ip
              let res3 = await fetch("https://api.db-ip.com/v2/free/self");
              let data3 = await res3.json();
              finalIP = data3.ipAddress;
            } catch (e3) {
              try {
                // Coba 4: API jsonip
                let res4 = await fetch("https://jsonip.com");
                let data4 = await res4.json();
                finalIP = data4.ip;
              } catch (e4) {
                // Jika semua diblokir
                finalIP = "Blocked by Browser/Adblock";
              }
            }
          }
        }

        ipElement.textContent = finalIP;
        handleVisitorHistory(finalIP); // Panggil riwayat setelah dapat IP
      }
      getIP();

      // --- Date & Time (Asia/Jakarta) ---
      const now = new Date();
      document.getElementById("date").textContent = now.toLocaleDateString(
        "id-ID",
        { timeZone: "Asia/Jakarta" },
      );
      document.getElementById("clock").textContent = now.toLocaleTimeString(
        "id-ID",
        { timeZone: "Asia/Jakarta" },
      );

      // --- User-Agent & Browser ---
      const ua = navigator.userAgent;
      document.getElementById("ua").textContent = ua;

      function getBrowser() {
        if (ua.includes("Edg/")) return "Microsoft Edge";
        if (ua.includes("OPR/") || ua.includes("Opera")) return "Opera";
        if (ua.includes("Chrome/") && !ua.includes("Edg/"))
          return "Google Chrome";
        if (ua.includes("Firefox/")) return "Mozilla Firefox";
        if (ua.includes("Safari/") && !ua.includes("Chrome/")) return "Safari";
        return "Unknown";
      }
      document.getElementById("browser").textContent = getBrowser();
    </script>
  </body>
</html>
